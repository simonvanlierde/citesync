name: advisories

# The stack workflows audit dependencies on push and pull request. A new advisory can land
# against a lockfile with no commit here, so this audits again every Monday. A failure shows
# on the Actions page and in the failed-run email.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: "python: uv audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv audit --locked --preview-features audit-command

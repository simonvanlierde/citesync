name: Matrix consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check

jobs:
  consumer:
    name: Packed Matrix CLI to citesync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The reviewed producer includes linked people and the family-first fix.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simonvanlierde/credit-matrix
          ref: a8a55c648bbb45862d60fbdbd6d51cd75eea3cc3
          path: .matrix-source
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          working-directory: .matrix-source
          node-version-file: .node-version
          install: false
          cache: false

      - name: Build and pack the pinned producer
        run: |
          pnpm --dir .matrix-source install --frozen-lockfile
          pnpm --dir .matrix-source/src/core pack --pack-destination "$GITHUB_WORKSPACE/.matrix-tarball"
          mkdir .matrix-package
          tar -xzf .matrix-tarball/*.tgz -C .matrix-package

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: false

      - run: uv sync --frozen
      - name: Test the packed CLI through citesync write and check
        env:
          CREDIT_MATRIX_CLI: ${{ github.workspace }}/.matrix-package/package/dist/cli.js
        run: uv run --frozen pytest tests/test_matrix_consumer.py

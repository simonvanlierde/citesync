[project]
name = "citesync"
version = "0.1.0"
description = "Check that CITATION.cff, codemeta.json, .zenodo.json and the package manifests (pyproject.toml, Cargo.toml, package.json) agree, and rewrite them to match one source file, using the CodeMeta crosswalks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon van Lierde", email = "code@duinlab.nl" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["citation", "CITATION.cff", "codemeta", "zenodo", "software-metadata", "pre-commit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "packaging>=26.3",
    "ruamel-yaml>=0.19",
    "tomlkit>=0.15.2",
]

[project.scripts]
citesync = "citesync.cli:main"

[project.urls]
Homepage = "https://github.com/simonvanlierde/citesync"
Issues = "https://github.com/simonvanlierde/citesync/issues"
Changelog = "https://github.com/simonvanlierde/citesync/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "hypothesis>=6.140",
  "jsonschema>=4.25",
  "memray>=1.20.0 ; sys_platform != 'win32'",
  "mutmut==3.8.0",
  "pyinstrument>=5.1.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. The dependency bot waits the same week.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "citesync"

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
  "TD002",  # missing-todo-author: a plain `# TODO:` is enough
  "TD003",  # missing-todo-link
]

# Tests assert, use literal expectations, and need no docstrings, return
# annotations, or package __init__.py.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D1", "INP001", "PLR2004", "ANN201"]
# The command line reports to the terminal.
"src/citesync/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Format ids, terms and finding codes are the vocabulary, not magic values.
allow-magic-value-types = ["int", "str"]
max-args = 10

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
error-on-warning = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. No fail_under until there is a suite worth setting
# one against.
# Mutation testing (`just mutation`, not in CI) covers the comparison code only.
[tool.mutmut]
source_paths = ["src/citesync"]
only_mutate = ["src/citesync/check.py", "src/citesync/codecs.py", "src/citesync/write.py", "src/citesync/jsonsplice.py"]
pytest_add_cli_args_test_selection = ["tests"]
also_copy = ["docs", ".pre-commit-hooks.yaml"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
